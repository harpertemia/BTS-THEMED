    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Cinzel"', 'serif'],
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        army: {
                            void: '#0D061A',
                            midnight: '#160B2E',

    <style>
        /* Cosmic Purple Galaxy Background & Holographic Effects */
        body {
            background-color: #090412;
            color: #F5F3FF;
            overflow-x: hidden;
        }

        /* Floating Starlight & Purple Heart Canvas */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        /* VIP Concert Pass Entrance Gate Transition */
        #welcome-gate {
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
        }
        #welcome-gate.opened {
            opacity: 0;
            transform: scale(1.08);
            visibility: hidden;
            pointer-events: none;
        }

        /* Deep Nebula Galaxy Gradient */
        .nebula-bg {
            background-color: #120824;
            background-image:
                radial-gradient(circle at 18% 12%, rgba(139, 92, 246, 0.32) 0%, transparent 45%),
                radial-gradient(circle at 85% 22%, rgba(244, 114, 182, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 15% 65%, rgba(109, 40, 217, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 82% 85%, rgba(196, 181, 253, 0.2) 0%, transparent 48%);
        }

        /* Frosted Glass Cosmic Card with Iridescent Border */
        .cosmic-card {
            background: rgba(26, 13, 54, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(196, 181, 253, 0.28);
            box-shadow: 0 12px 35px -10px rgba(109, 40, 217, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Holographic Shimmer Gradient */
        .holo-gradient {
            background: linear-gradient(135deg, #7C3AED 0%, #C084FC 35%, #F472B6 70%, #818CF8 100%);
        }

        .holo-text {
            background: linear-gradient(135deg, #F5F3FF 0%, #DDD6FE 40%, #F9A8D4 80%, #FDE68A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Gentle Cosmic Whale & Moon Floating Animation */
        @keyframes driftWhale {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(-2deg); }
            50% { transform: translateY(-10px) translateX(6px) rotate(2deg); }
        }
        .animate-whale {
            animation: driftWhale 6s ease-in-out infinite;
        }

        @keyframes pulseAura {
            0%, 100% { box-shadow: 0 0 18px rgba(139, 92, 246, 0.55), 0 0 36px rgba(244, 114, 182, 0.35); }
            50% { box-shadow: 0 0 28px rgba(167, 139, 250, 0.85), 0 0 52px rgba(244, 114, 182, 0.55); }
        }
        .glow-portal {
            animation: pulseAura 2.8s infinite;
        }

        /* Ticket Perforation Notch Effect */
        .ticket-divider {
            position: relative;
            border-top: 2px dashed rgba(196, 181, 253, 0.35);
        }
        .ticket-divider::before,
        .ticket-divider::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            background-color: #120824;
            border: 1px solid rgba(196, 181, 253, 0.25);
        }
        .ticket-divider::before { left: -35px; }
        .ticket-divider::after { right: -35px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #120824; }
        ::-webkit-scrollbar-thumb { background: #6D28D9; border-radius: 10px; }
    </style>
</head>
